<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="js/start.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="vehicles.html">Vehicles</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="refuels.html">Refuels</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="maintenance.html">Maintenance</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link btn ms-2 fs-4 fas" id="themeSwitch"></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-light ms-2" id="logoutButton">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <h2>Your vehicles:</h2>
            <div class="row mb-4 align-items-end">
                <div class="col-md-3">
                    <label for="vehicleFilter" class="form-label">Type</label>
                    <select class="form-select form-select-sm" id="vehicleFilter">
                        <option value="all" selected>All</option>
                        <option value="0">Car</option>
                        <option value="1">Motorcycle</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="fuelTypeFilter" class="form-label">Fuel type</label>
                    <select class="form-select form-select-sm" id="fuelTypeFilter">
                        <option value="all" selected>All</option>
                        <option value="0">Gasoline</option>
                        <option value="1">Diesel</option>
                        <option value="2">Electric</option>
                        <option value="3">Hybrid</option>
                    </select>
                </div>
                <div class="col-md-6 d-flex justify-content-end">
                    <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#addEntryModal">
                        <i class="bi bi-funnel me-1"></i>Add new entry
                    </button>
                </div>
            </div>
            <div class="row g-4 mt-4" id="vehiclesCards">
                <div class="col-md-4">
                    <div class="card shadow h-100">
                        <div class="card-body">
                            <h5 class="card-title">Golf Plus</h5>
                            <div class="mb-2">
                                <p class="card-text mb-0">VIN: sth</p>
                                <p class="card-text mb-0">Registration number: sth</p>
                                <p class="card-text mb-0">Year of production: sth</p>
                            </div>
                            <button class="btn btn-sm btn-outline-info me-1 stats-button">Stats</button>
                            <button class="btn btn-sm btn-outline-primary me-1 edit-btn">Edit</button>
                            <button class="btn btn-sm btn-outline-danger me-1 delete-btn">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="addEntryModal" tabindex="-1" aria-labelledby="addEntryLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addEntryLabel">
                    <i class="bi bi-plus-circle text-success me-2"></i>Add New Entry
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addEntryForm">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="FuelType" class="form-label">Fuel type</label>
                            <select class="form-select form-select-sm" id="FuelType" required>
                                <option value="" hidden>Select fuel type</option>
                                <option value="0">Gasoline</option>
                                <option value="1">Diesel</option>
                                <option value="2">Electric</option>
                                <option value="3">Hybrid</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editVehicleType" class="form-label">Vehicle type</label>
                            <select class="form-select form-select-sm" id="VehicleType" required>
                                <option value="" hidden>Select vehicle type</option>
                                <option value="0">Car</option>
                                <option value="1">Motorcycle</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="Make" class="form-label">Make</label>
                            <input type="text" class="form-control form-control-sm" id="Make" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="Model" class="form-label">Model</label>
                            <input type="text" class="form-control form-control-sm" id="Model" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="Year" class="form-label">Year</label>
                            <input type="number" class="form-control form-control-sm" id="Year" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="Mileage" class="form-label">Initial mileage</label>
                            <input type="number" class="form-control form-control-sm" id="Mileage" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="Vin" class="form-label">VIN</label>
                        <input type="text" class="form-control form-control-sm" id="Vin" required>
                    </div>
                    <div class="mb-3">
                        <label for="RegistrationNumber" class="form-label">Registration number</label>
                        <input type="text" class="form-control form-control-sm" id="RegistrationNumber" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success btn-sm" id="popupSubmitButton">
                        <i class="bi bi-check-circle me-1"></i>Add Entry
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<div class="modal fade" id="editEntryModal" tabindex="-1" aria-labelledby="addEntryLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editEntryLabel">
                    <i class="bi bi-plus-circle text-success me-2"></i>Edit entry
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <input type="number" id="editId" hidden>
            <form id="editEntryForm">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="editFuelType" class="form-label">Fuel type</label>
                            <select class="form-select form-select-sm" id="editFuelType" required>
                                <option value="" hidden>Select fuel type</option>
                                <option value="0">Gasoline</option>
                                <option value="1">Diesel</option>
                                <option value="2">Electric</option>
                                <option value="3">Hybrid</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editVehicleType" class="form-label">Vehicle type</label>
                            <select class="form-select form-select-sm" id="editVehicleType" required>
                                <option value="" hidden>Select vehicle type</option>
                                <option value="0">Car</option>
                                <option value="1">Motorcycle</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="editMake" class="form-label">Make</label>
                            <input type="text" class="form-control form-control-sm" id="editMake" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editModel" class="form-label">Model</label>
                            <input type="text" class="form-control form-control-sm" id="editModel" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="editYear" class="form-label">Year</label>
                            <input type="number" class="form-control form-control-sm" id="editYear" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editMileage" class="form-label">Initial mileage</label>
                            <input type="number" class="form-control form-control-sm" id="editMileage" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="editVin" class="form-label">VIN</label>
                        <input type="text" class="form-control form-control-sm" id="editVin" required>
                    </div>
                    <div class="mb-3">
                        <label for="editRegistrationNumber" class="form-label">Registration number</label>
                        <input type="text" class="form-control form-control-sm" id="editRegistrationNumber" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success btn-sm" id="editSubmitButton">
                        <i class="bi bi-check-circle me-1"></i>Submit Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/universal.js"></script>
</body>
</html>
