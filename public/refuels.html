<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="js/start.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary shadow navbar-dark">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="vehicles.html">Vehicles</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="refuels.html">Refuels</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="maintenance.html">Maintenance</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link btn ms-2 fs-4 fas" id="themeSwitch"></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn ms-2" id="logoutButton">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <h2>Your refuels:</h2>
            <div class="row mb-4 align-items-end">
                <div class="col-md-3">
                    <label for="vehicleFilter" class="form-label">Vehicle</label>
                    <select class="form-select form-select-sm" id="vehicleFilter">
                        <option value="all" selected>All</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="dateRange" class="form-label">Date Range</label>
                    <select class="form-select form-select-sm" id="dateRange">
                        <option value="all" selected>All</option>
                        <option value="7">Last 7 days</option>
                        <option value="30">Last 30 days</option>
                        <option value="365">Last Year</option>
                    </select>
                </div>
                <div class="col-md-6 d-flex justify-content-end">
                    <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#addEntryModal">
                        <i class="bi bi-funnel me-1"></i>Add new entry
                    </button>
                </div>
            </div>
            <h4>Refueling Overview</h4>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th>Vehicle</th>
                        <th>Date</th>
                        <th>Fuel price</th>
                        <th>Fuel Amount</th>
                        <th>Total Cost</th>
                        <th>Mileage</th>
                        <th>Gas Station</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="vehiclesTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="addEntryModal" tabindex="-1" aria-labelledby="addEntryLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addEntryLabel">
                    <i class="bi bi-plus-circle text-success me-2"></i>Add New Entry
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addEntryForm">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="entryVehicle" class="form-label">Vehicle</label>
                            <select class="form-select form-select-sm" id="entryVehicle" required>
                                <option value="" hidden>Select Vehicle</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" class="form-control form-control-sm" id="date" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fuelAmount" class="form-label">Fuel amount</label>
                            <input type="number" class="form-control form-control-sm" id="fuelAmount" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="fuelPrice" class="form-label">Fuel price</label>
                            <input type="number" class="form-control form-control-sm" id="fuelPrice" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fuelType" class="form-label">Fuel type</label>
                            <select class="form-select form-select-sm" id="fuelType" required>
                                <option value="" hidden>Select fuel type</option>
                                <option value="0">Gasoline</option>
                                <option value="1">Diesel</option>
                                <option value="2">Electricity</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="mileageAtRefuel" class="form-label">Mileage</label>
                            <input type="number" class="form-control form-control-sm" id="mileageAtRefuel" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="gasStation" class="form-label">Gas station</label>
                        <input type="text" class="form-control form-control-sm" id="gasStation" required>
                    </div>
                    <div class="mb-3">
                        <label for="invoiceLink" class="form-label">Invoice link</label>
                        <input type="text" class="form-control form-control-sm" id="invoiceLink" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success btn-sm" id="popupSubmitButton">
                        <i class="bi bi-check-circle me-1"></i>Add Entry
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<div class="modal fade" id="editEntryModal" tabindex="-1" aria-labelledby="addEntryLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editEntryLabel">
                    <i class="bi bi-plus-circle text-success me-2"></i>Edit entry
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <input type="number" id="editId" hidden>
            <form id="editEntryForm">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="editEntryVehicle" class="form-label">Vehicle</label>
                            <select class="form-select form-select-sm" id="editEntryVehicle" disabled>
                                <option value="" hidden>Select Vehicle</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editDate" class="form-label">Date</label>
                            <input type="date" class="form-control form-control-sm" id="editDate" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="editFuelAmount" class="form-label">Fuel amount</label>
                            <input type="number" class="form-control form-control-sm" id="editFuelAmount" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editFuelPrice" class="form-label">Fuel price</label>
                            <input type="number" class="form-control form-control-sm" id="editFuelPrice" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="editFuelType" class="form-label">Fuel type</label>
                            <select class="form-select form-select-sm" id="editFuelType" required>
                                <option value="" hidden>Select fuel type</option>
                                <option value="0">Gasoline</option>
                                <option value="1">Diesel</option>
                                <option value="2">Electricity</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editMileageAtRefuel" class="form-label">Mileage</label>
                            <input type="number" class="form-control form-control-sm" id="editMileageAtRefuel" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="editGasStation" class="form-label">Gas station</label>
                        <input type="text" class="form-control form-control-sm" id="editGasStation" required>
                    </div>
                    <div class="mb-3">
                        <label for="editInvoiceLink" class="form-label">Invoice link</label>
                        <input type="text" class="form-control form-control-sm" id="editInvoiceLink" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success btn-sm" id="editSubmitButton">
                        <i class="bi bi-check-circle me-1"></i>Submit Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/refuels.js"></script>
<script src="js/universal.js"></script>
</body>
</html>
