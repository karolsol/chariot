<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h3 class="card-title text-center mb-4">Login</h3>
                    <form>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="loginButton">Login</button>
                    </form>
                    <p class="text-center mt-3 mb-0">
                        Not registered? <a href="register.html">Create account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("loginButton").onclick = async (event) => {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username) {
            alert('Please enter a username.');
            return;
        }

        if (!password) {
            alert('Please enter a password.');
            return;
        }

        const url = '/auth/login';

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({username, password})
        })
            .then(async response => {
                if (response.ok) {
                    if (response.ok) {
                        const data = await response.json();
                        const token = data["access_token"];
                        localStorage.setItem("access_token", token);
                        window.location.href = 'index.html';
                        return;
                    }
                    window.location.href = 'login.html';
                    return;
                }
                    return response.json()
                        .then(data => {
                            const errorText = data && data.message ? data.message : (response.statusText || response.status);
                            throw new Error(errorText);
                        })
                        .catch(() => {
                            const errorText = response.statusText || response.status;
                            throw new Error(errorText);
                        });
                }
            )
            .
                catch(err => {
                    console.error('Fetch error:', err);
                });
            }
</script>
</body>
</html>
