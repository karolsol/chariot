services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chariot-dev
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql:Z
  chariot:
    image: chariot:latest
    container_name: chariot
    environment:
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: chariot-dev
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - postgres
