name: PR Checks

on:
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint
        env:
          TSESTREE_ALLOW_BEFORE_TS5: true
          TYPESCRIPT_ESLINT_RECORD_TS_VERSIONS: "1"

      - name: Typecheck
        run: pnpm type-check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test
