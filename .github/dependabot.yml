version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/frontend/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 25
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(frontend):"
    reviewers:
      - "karolsol"
    assignees:
      - "karolsol"
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 25
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(backend):"
    reviewers:
      - "karolsol"
    assignees:
      - "karolsol"
    groups:
      typescript-dependencies:
        patterns:
          - "typescript"
          - "ts-*"
          - "tsconfig*"
      types-dependencies:
        patterns:
          - "@types/*"
      eslint-dependencies:
        patterns:
          - "@eslint/*"
          - "eslint*"
          - "typescript-eslint*"
      nestjs-dependencies:
        patterns:
          - "@nestjs*"
