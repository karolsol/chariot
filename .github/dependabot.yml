version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    assignees:
      - "karolsol"
    groups:
      vue:
        patterns:
          - "vue*"
          - "@vue/*"
          - "vite*"
          - "@vitejs/*"
          - "pinia"
          - "@iconify/vue"
          - "@tanstack/vue-query"
      nestjs:
        patterns:
          - "@nestjs/*"
          - "rxjs"
          - "reflect-metadata"
      database:
        patterns:
          - "typeorm"
          - "@nestjs/typeorm"
          - "pg"
      authentication:
        patterns:
          - "passport*"
          - "@nestjs/passport"
          - "bcrypt"
          - "@types/bcrypt"
          - "cookie-parser"
      linters-and-types:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier*"
          - "typescript*"
          - "@typescript-eslint/*"
          - "@types/*"
          - "@tsconfig/*"
      testing:
        patterns:
          - "vitest"
          - "jsdom"
          - "@vue/test-utils"
          - "supertest"
          - "@types/supertest"