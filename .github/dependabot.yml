version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(pnpm):"
    assignees:
      - "karolsol"
    ignore:
      # TypeScript 7 is not supported by eslint and is probably not going to be
      # https://github.com/typescript-eslint/typescript-eslint/issues/12518
      - dependency-name: "typescript"
        versions: [ ">= 7.0.0, < 8.0.0" ]
    groups:
      vue:
        patterns:
          - "vue*"
          - "@vue/*"
          - "vite*"
          - "@vitejs/*"
          - "pinia"
          - "@iconify/vue"
          - "@tanstack/vue-query"
      nestjs:
        patterns:
          - "@nestjs/*"
          - "rxjs"
          - "reflect-metadata"
      database:
        patterns:
          - "typeorm"
          - "@nestjs/typeorm"
          - "pg"
      authentication:
        patterns:
          - "passport*"
          - "@nestjs/passport"
          - "bcrypt"
          - "@types/bcrypt"
          - "cookie-parser"
      linters-and-types:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier*"
          - "typescript*"
          - "@typescript-eslint/*"
          - "@types/*"
          - "@tsconfig/*"
      testing:
        patterns:
          - "vitest"
          - "jsdom"
          - "@vue/test-utils"
          - "supertest"
          - "@types/supertest"
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    target-branch: "develop"
    assignees:
      - "karolsol"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(github-actions):"

  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "develop"
    assignees:
      - "karolsol"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(docker):"
